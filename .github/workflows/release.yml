name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build-macos:
    name: macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --features "macos gui record"
      - name: Smoke test
        run: target/${{ matrix.target }}/release/framewatch --version
      - name: Package
        run: |
          mkdir release
          ditto -c -k --sequesterRsrc target/${{ matrix.target }}/release/framewatch release/framewatch-${{ matrix.target }}.zip
      - name: Build managed Whisper runtime
        run: |
          git clone --depth 1 --branch v1.9.2 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --target whisper-cli --config Release
          ditto -c -k --sequesterRsrc whisper.cpp/build/bin/whisper-cli release/framewatch-whisper-${{ matrix.target }}.zip
          shasum -a 256 release/framewatch-whisper-${{ matrix.target }}.zip > release/framewatch-whisper-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framewatch-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  build-windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --release --features "wgc gui record"
      - name: Smoke test
        run: .\target\release\framewatch.exe --version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path target\release\framewatch.exe -DestinationPath release\framewatch-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framewatch-x86_64-pc-windows-msvc
          path: release/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux recording build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libgomp1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --release --features "linux-x11 gui record"
      - name: Smoke test
        run: target/release/framewatch --version
      - name: Package
        run: |
          mkdir release
          tar -C target/release -czf release/framewatch-x86_64-unknown-linux-gnu.tar.gz framewatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framewatch-x86_64-unknown-linux-gnu
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [publish-crates-io, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum framewatch-*.zip framewatch-*.tar.gz > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --generate-notes --title "$TAG"
          fi

  publish-crates-io:
    name: Publish crates.io
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
